name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Archive macOS app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "Slotty.app" "slotty-macos.zip"
          mkdir -p dmg-staging
          cp -R "Slotty.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Slotty" -srcfolder dmg-staging -ov -format UDZO "slotty-macos.dmg"
          rm -rf dmg-staging

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: slotty-macos
          path: |
            build/macos/Build/Products/Release/slotty-macos.zip
            build/macos/Build/Products/Release/slotty-macos.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Archive Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/windows/x64/runner/slotty-windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: slotty-windows
          path: build/windows/x64/runner/slotty-windows.zip

  release:
    name: Publish GitHub Release
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: slotty-macos
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: slotty-windows
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/slotty-macos.dmg
            dist/slotty-macos.zip
            dist/slotty-windows.zip
