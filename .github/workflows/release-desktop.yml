name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build and Notarize macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up keychain and Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PWD=$(openssl rand -hex 12)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PWD=$KEYCHAIN_PWD" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Add keychain to search list and set as default
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN_PATH"

          # Import Developer ID CA certificates
          curl -sS -o $RUNNER_TEMP/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import $RUNNER_TEMP/DeveloperIDG2CA.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

          # Import Developer ID Application identity
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Discover exact identity from keychain
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -n 1 | awk -F '"' '{print $2}')
          echo "Discovered signing identity: $SIGNING_IDENTITY"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV

      - name: Build macOS release
        run: flutter build macos --release

      - name: Sign macOS App
        run: |
          cd build/macos/Build/Products/Release
          # Sign nested frameworks and dylibs
          if [ -d "Slotty.app/Contents/Frameworks" ]; then
            find Slotty.app/Contents/Frameworks -mindepth 1 -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) | while read -r item; do
              codesign --force --verify --verbose --sign "$SIGNING_IDENTITY" --options runtime --keychain "$KEYCHAIN_PATH" "$item"
            done
          fi
          # Sign app bundle with Hardened Runtime
          codesign --force --verify --verbose --deep --sign "$SIGNING_IDENTITY" --options runtime --entitlements "$GITHUB_WORKSPACE/macos/Runner/Release.entitlements" --keychain "$KEYCHAIN_PATH" "Slotty.app"

      - name: Package and Sign DMG
        run: |
          cd build/macos/Build/Products/Release
          mkdir -p dmg-staging
          cp -R "Slotty.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Slotty" -srcfolder dmg-staging -ov -format UDZO "slotty-macos.dmg"
          rm -rf dmg-staging
          codesign --force --verify --verbose --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" "slotty-macos.dmg"

      - name: Notarize and Staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd build/macos/Build/Products/Release
          echo "Submitting DMG to Apple Notary Service..."
          xcrun notarytool submit "slotty-macos.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "slotty-macos.dmg"

      - name: Create Zip Archive
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "Slotty.app" "slotty-macos.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: slotty-macos
          path: |
            build/macos/Build/Products/Release/slotty-macos.zip
            build/macos/Build/Products/Release/slotty-macos.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Archive Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/windows/x64/runner/slotty-windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: slotty-windows
          path: build/windows/x64/runner/slotty-windows.zip

  release:
    name: Publish GitHub Release
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: slotty-macos
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: slotty-windows
          path: dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/slotty-macos.dmg
            dist/slotty-macos.zip
            dist/slotty-windows.zip
